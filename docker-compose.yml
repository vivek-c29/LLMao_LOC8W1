version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: loc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loc_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend-worker:
    build:
      context: ./frontend-worker
      dockerfile: Dockerfile
    container_name: loc_frontend_worker
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend-worker:/app
      - /app/node_modules

  frontend-client:
    build:
      context: ./frontend-client
      dockerfile: Dockerfile
    container_name: loc_frontend_client
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "4000:4000"
    depends_on:
      - backend
    volumes:
      - ./frontend-client:/app
      - /app/node_modules

volumes:
  postgres_data:
